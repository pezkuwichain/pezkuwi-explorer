# cuzdan.pex.network: the short, announced address of i-Wallet. A redirect, never a copy of the site:
# browser storage is per origin, so a copy would hold a separate wallet.
server {
    listen 80;
    listen [::]:80;
    server_name cuzdan.pex.network;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://cuzdan.pex.network$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cuzdan.pex.network;
    ssl_certificate     /etc/letsencrypt/live/cuzdan.pex.network/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cuzdan.pex.network/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / { return 301 https://explorer.pezkuwichain.io/i-wallet$is_args$args; }
}
