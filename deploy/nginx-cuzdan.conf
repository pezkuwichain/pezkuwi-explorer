# deploy/nginx-cuzdan.conf - reference copy of the short-address vhost (i-Wallet launch).
# cuzdan.pex.network and wallet.pex.network only redirect: browser storage is per origin, so a twin of the
# site would hold a separate wallet. The wallet lives at https://explorer.pezkuwichain.io/i-wallet.
server {
    listen 80;
    listen [::]:80;
    server_name cuzdan.pex.network wallet.pex.network;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://explorer.pezkuwichain.io/i-wallet$is_args$args; }
}

server {
    # nginx 1.24 on the host: http2 stays on the listen line
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cuzdan.pex.network wallet.pex.network;
    ssl_certificate     /etc/letsencrypt/live/cuzdan.pex.network/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cuzdan.pex.network/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    return 301 https://explorer.pezkuwichain.io/i-wallet$is_args$args;
}
