# deploy/nginx-explorer.conf - reference copy of the production vhost (domain only).
# The connect-src list must change in the same commit as any change to src/config/network.ts
# (src/config/network.test.ts checks that every configured origin appears below).
#
# CSP notes, each measured against the built bundle:
#  - 'wasm-unsafe-eval': the @pezkuwi crypto WASM is instantiated at API start-up; Chromium
#    refuses it without this keyword ("Unable to initialize @pezkuwi/wasm-crypto").
#  - media-src 'none': the QR scanner only sets video.srcObject to a MediaStream, which CSP does
#    not govern (verified with a fake camera under media-src 'none').
#  - WalletConnect (@walletconnect/sign-client 2.26.0): relay wss://relay.walletconnect.org and the
#    Verify API https://verify.walletconnect.org. Telemetry (pulse.walletconnect.org), push
#    registration (echo.walletconnect.com) and the Verify iframe fallback (frame-src) are
#    deliberately not allowed; the explorer is read-only and none of them is needed to pair.
server {
    listen 80;
    listen [::]:80;
    server_name explorer.pezkuwichain.io;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # nginx 1.24 on the host: http2 stays on the listen line
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name explorer.pezkuwichain.io;
    ssl_certificate     /etc/letsencrypt/live/explorer.pezkuwichain.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/explorer.pezkuwichain.io/privkey.pem;
    root /var/www/explorer;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data:; font-src 'self'; media-src 'none'; connect-src 'self' wss://zagros-rpc.pezkuwichain.io wss://zagros-asset-hub-rpc.pezkuwichain.io wss://zagros-people-rpc.pezkuwichain.io https://subquery.pezkuwichain.io wss://relay.walletconnect.org https://verify.walletconnect.org; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'; worker-src 'self'; upgrade-insecure-requests" always;

    # No add_header inside the locations: nginx would then drop the server-level security
    # headers above. `expires` sets Cache-Control without that side effect.
    location /assets/ { expires 1y; }                      # content-hashed file names
    location = /sw.js { expires -1; }                      # Cache-Control: no-cache
    location / { try_files $uri /index.html; expires -1; }
}
