# deploy/nginx-explorer.conf - reference copy of the production vhost (domain only).
# The connect-src list must change in the same commit as any change to src/config/network.ts
# (src/config/network.test.ts checks that every configured origin appears below).
#
# CSP notes, each measured against the built bundle:
#  - 'wasm-unsafe-eval': the @pezkuwi crypto WASM is instantiated at API start-up; Chromium
#    refuses it without this keyword ("Unable to initialize @pezkuwi/wasm-crypto").
#  - media-src 'none': the QR scanner only sets video.srcObject to a MediaStream, which CSP does
#    not govern (verified with a fake camera under media-src 'none').
#  - WalletConnect (@walletconnect/sign-client 2.26.0): relay wss://relay.walletconnect.org, the
#    Verify API https://verify.walletconnect.org, and the Verify iframe (frame-src, .org and its .com
#    fallback). Without the iframe the wallet cannot attest which domain is asking, and a live pairing
#    logged "Framing 'https://verify.walletconnect.org/' violates ... default-src 'self'". Telemetry
#    (pulse.walletconnect.org) and push registration (echo.walletconnect.com) are not needed to pair.
#
# History endpoint (/history/assethub, src/config/network.ts ZAGROS_HISTORY_URL): same origin as the
# site, so connect-src 'self' covers it and the CSP needs no new token. Its rate-limit zone must be
# declared in the http context, which this server file is not; on the host it lives in
# /etc/nginx/conf.d/explorer-history.conf:
#     limit_req_zone $binary_remote_addr zone=explorer_history:1m rate=5r/s;
server {
    listen 80;
    listen [::]:80;
    server_name explorer.pezkuwichain.io;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # nginx 1.24 on the host: http2 stays on the listen line
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name explorer.pezkuwichain.io;
    ssl_certificate     /etc/letsencrypt/live/explorer.pezkuwichain.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/explorer.pezkuwichain.io/privkey.pem;
    root /var/www/explorer;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data:; font-src 'self'; media-src 'none'; connect-src 'self' wss://zagros-rpc.pezkuwichain.io wss://zagros-asset-hub-rpc.pezkuwichain.io wss://zagros-people-rpc.pezkuwichain.io https://subquery.pezkuwichain.io wss://relay.walletconnect.org https://verify.walletconnect.org; frame-src https://verify.walletconnect.org https://verify.walletconnect.com; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'; worker-src 'self'; upgrade-insecure-requests" always;

    # No add_header inside the locations: nginx would then drop the server-level security
    # headers above. `expires` sets Cache-Control without that side effect.
    location /assets/ { expires 1y; }                      # content-hashed file names
    location = /sw.js { expires -1; }                      # Cache-Control: no-cache
    location / { try_files $uri /index.html; expires -1; }
    # Read-only GraphQL of the Asset Hub history indexer (local SubQuery query service). POST only,
    # small bodies, rate-limited per client; the Host header is pinned to what the service expects.
    location = /history/assethub {
        limit_except POST { deny all; }
        client_max_body_size 8k;
        limit_req zone=explorer_history burst=20 nodelay;
        proxy_pass http://127.0.0.1:3100/;
        proxy_set_header Host 127.0.0.1;
        proxy_read_timeout 15s;
        # The indexer's query service names itself and answers any origin; neither belongs on this site.
        proxy_hide_header X-Powered-By;
        proxy_hide_header Access-Control-Allow-Origin;
    }
}
